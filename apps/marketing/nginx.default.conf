server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck usado pelo HEALTHCHECK do Docker e pelo depends_on do nginx da borda
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Site estatico: URL inexistente devolve 404 real (nao soft-404), bom para SEO.
    location / {
        try_files $uri $uri/ =404;
    }

    # Pagina de erro propria, mesma identidade visual
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
