<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZiraDesk</title>
    <meta name="description" content="ZiraDesk — central de atendimento omnichannel." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #ffffff;
        --text: #14171c;
        --muted: #5b6472;
        --primary: #00a88c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }

      main { text-align: center; max-width: 34rem; }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 3rem);
        letter-spacing: -0.02em;
      }

      h1 span { color: var(--primary); }

      p { margin: 0 0 24px; color: var(--muted); }

      a {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 8px;
        background: var(--primary);
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <main>
      <h1>Zira<span>Desk</span></h1>
      <p>Central de atendimento omnichannel. Site em construção.</p>
      <a href="https://app.ziradesk.com">Acessar o sistema</a>
    </main>
  </body>
</html>
