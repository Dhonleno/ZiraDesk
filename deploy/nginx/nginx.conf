user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format ziradesk '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'cf_ip="$http_cf_connecting_ip" host="$host"';

  access_log /var/log/nginx/access.log ziradesk;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  # Ajustes para upload de anexos e buffers de proxy.
  client_max_body_size 12M;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # Docker embedded DNS - re-resolucao dinamica dos upstreams.
  # valid=10s derruba o cache de 600s que mantem IP morto apos
  # restart fora-de-banda do container api (divida B, secao 16).
  resolver 127.0.0.11 valid=10s ipv6=off;

  include /etc/nginx/conf.d/*.conf;
}
