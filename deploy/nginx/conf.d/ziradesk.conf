# Portal de clientes (suporte.{tenant}.ziradesk.com) — server block restaurado
# a partir do historico git (commit d15d7af reverteu, este commit reaplica).
#
# ATENCAO — limitacao estrutural do Cloudflare Origin Certificate:
# Origin Certificates nao suportam wildcard de dois niveis
# (*.*.ziradesk.com) nem wildcard interno. O certificado atual cobre o
# maximo possivel para Origin CA: ziradesk.com e *.ziradesk.com.
# Consequencia: o portal suporte.{tenant}.ziradesk.com permanece sem TLS
# de origem valido ate uma alternativa ser escolhida e implementada.
# Alternativas pendentes:
# 1. Enumerar hostnames especificos por tenant no certificado (nao escala).
# 2. Investigar Cloudflare Advanced Certificate Manager (pago; nao confirmado
#    para este caso, e atua na borda, nao no Origin CA).
# 3. Redesenhar a URL do portal para nao depender de dois niveis de subdominio.

# Sem blocos `upstream` nomeados — decisao deliberada, nao esquecimento.
# No nginx open source a diretiva `resolver` nao atua dentro de `upstream`
# (isso e recurso do NGINX Plus), entao um upstream nomeado resolve o hostname
# uma unica vez, na carga da config, e mantem o IP em cache ate o proximo
# reload. Se o container for recriado fora de um deploy (OOM, crash, reboot do
# host, `restart: unless-stopped`), o nginx segue apontando para o IP morto e
# devolve 502 — silenciosamente, porque `/` continua sendo servido por
# web/marketing e mascara a falha.
#
# Por isso cada server :443 declara seus backends em `set $backend_*` e todo
# proxy_pass usa a variavel: com o host em variavel a resolucao passa a ocorrer
# por request, via `resolver 127.0.0.11 valid=10s` definido em nginx.conf.
# Contrapartida aceita: sem bloco upstream nao ha mais marcacao passiva de
# falha (max_fails/fail_timeout). Como havia um unico backend por servico, nao
# existia failover para onde cair — a perda e nominal.
# Ver ARQUITETURA_TECNICA.md secao 16, divida do cache de IP de upstream.

# Cloudflare IPv4 CIDRs
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6 CIDRs
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name ziradesk.com www.ziradesk.com app.ziradesk.com api.ziradesk.com ~^([a-z0-9-]+)\.ziradesk\.com$ ~^suporte\.([a-z0-9-]+)\.ziradesk\.com$;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  # default_server explicito: ate aqui o "host desconhecido cai no app" era
  # efeito posicional (primeiro bloco 443 do arquivo). Fixar evita que um
  # bloco novo, ou um conf.d/*.conf que ordene antes, roube o default.
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name app.ziradesk.com;

  # Backends em variavel — obriga re-resolucao por request (ver topo do arquivo).
  set $backend_api "api:3333";
  set $backend_web "web:80";

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /socket.io/ {
    proxy_pass http://$backend_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /api/ {
    proxy_pass http://$backend_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://$backend_web$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Apex + www: landing page estatica, servida pelo container `marketing`.
# server_name exato vence regex no nginx, entao este bloco captura
# www.ziradesk.com mesmo com o bloco de tenant (~^([a-z0-9-]+)\.ziradesk\.com$)
# ainda casando o mesmo host — nao e preciso alterar aquela regex.
# O /api/ aqui existe para o formulario de leads da landing sair same-origin,
# eliminando CORS: a regex de origem em server.ts nao cobre o apex.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ziradesk.com www.ziradesk.com;

  # Backends em variavel — obriga re-resolucao por request (ver topo do arquivo).
  set $backend_api "api:3333";
  set $backend_marketing "marketing:80";

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://$backend_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://$backend_marketing$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.ziradesk.com;

  # Backend em variavel — obriga re-resolucao por request (ver topo do arquivo).
  set $backend_api "api:3333";

  ssl_certificate /etc/nginx/certs/fullchain.pem;
